# SonarCloud project configuration.
#
# Project key + organization are also set in the SonarCloud dashboard;
# these properties make the scanner discover them locally without an
# extra CLI flag.
#
# Auto-analysis stopped firing on PRs after PR #29 (project switched to
# CI-based scanning silently). The `test` job in
# .github/workflows/ci.yml replaces auto-analysis as the canonical
# trigger; this file declares what the scanner sees.

sonar.projectKey=agentculture_irc-lens
sonar.organization=agentculture

sonar.sources=src
sonar.tests=tests

# Match what we ship in pyproject.toml (Python 3.11, 3.12, 3.13).
sonar.python.version=3.11,3.12,3.13

# Generated/cached/asset paths the scanner should ignore.
sonar.exclusions=**/__pycache__/**,uv.lock,**/*.j2,**/*.html,docs/**,.afi/**,src/irc_lens/static/vendor/**

# Test fixtures aren't production code; keep them out of the test
# coverage / duplication baselines.
sonar.test.exclusions=tests/fixtures/**,tests/_agentirc_server.py

# Coverage report path — ci.yml's `test` job runs
# `pytest --cov-report=xml:coverage.xml` which writes coverage.xml in
# the workspace root.
sonar.python.coverage.reportPaths=coverage.xml

# Browser assets (JS/CSS under static/) are outside the Python coverage
# regime: coverage.xml only carries pytest-cov data, so these files would
# otherwise count as 0%-covered "new code" and sink the new-code coverage
# gate. Their behaviour is verified by the Playwright suite (which doesn't
# emit an lcov report to ingest here), not by unit coverage. They are still
# analysed for issues — this excludes them from coverage measurement only.
sonar.coverage.exclusions=src/irc_lens/static/**
