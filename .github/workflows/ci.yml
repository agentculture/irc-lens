name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The `test` job is also the SonarCloud-bearing job. SonarCloud's
  # auto-analysis silently stopped decorating PRs after PR #29 (only
  # main-branch refresh tasks fire, tagged "Anonymous", ~2-3s; PR diffs
  # are skipped). CI-based scanning is the SonarCloud-recommended fallback
  # when auto-analysis breaks, and it's the only path that can ingest a
  # coverage report. Required repo secret: SONAR_TOKEN (generated at
  # sonarcloud.io → My Account → Security). Step is gated on
  # `env.SONAR_TOKEN != ''` so contributor PRs without secret access skip
  # cleanly instead of hard-failing the check.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Promote SONAR_TOKEN to job env so the SonarCloud step can gate on
    # `env.SONAR_TOKEN != ''` — `secrets.*` isn't allowed in `if:`. This
    # makes the step a no-op on fork PRs (where the secret isn't injected)
    # and on any repo that hasn't configured the token yet, instead of
    # failing the whole job.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Sonar needs full git history for accurate "new code" blame attribution.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - run: uv python install 3.12

      # irc-lens uses [project.optional-dependencies] (not [dependency-groups]),
      # so `uv sync` alone won't install pytest/pytest-cov. The `--extra dev`
      # flag is the steward-equivalent install for this dep layout.
      - run: uv sync --extra dev

      - name: pytest with coverage
        run: uv run pytest --cov=src/irc_lens --cov-report=xml:coverage.xml --cov-report=term -v

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_HOST_URL: https://sonarcloud.io

  playwright:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - run: uv python install 3.12

      - run: uv venv

      - run: uv pip install -e ".[dev]"

      - name: Install chromium for pytest-playwright
        run: uv run playwright install --with-deps chromium

      - name: pytest -m playwright
        run: uv run pytest -m playwright -v
